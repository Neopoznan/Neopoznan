# Группа, в которой нужно отслеживать сообщения.
# Можно указать: числовой chat id (например -1001234567890),
# @username группы, или пригласительную ссылку/юзернейм без @.
chat: "@my_group_username"

# Ключевые слова, при появлении которых в чужом сообщении будет отправлен ответ.
# Сравнение регистронезависимое, ищется целое слово (границы слова), не часть другого слова.
keywords:
  - "кто едет"
  - "нужен водитель"
  - "поехали"

# Текст, который бот отправит новым сообщением в чат при срабатывании.
# Отправляется не более одного раза за сообщение, даже если в нём совпало
# сразу несколько ключевых слов.
response_text: "я поеду"

# Задержка перед отправкой ответа после того, как сработало ключевое слово, в секундах.
delay_seconds: 3

# Минимальный интервал между двумя срабатываниями, в секундах.
# Отсчёт начинается в момент обнаружения ключевого слова (то есть уже
# включает в себя delay_seconds). 36000 секунд = 10 часов.
cooldown_seconds: 36000

# Если true — скрипт только логирует, что сработало бы, но ничего не отправляет.
# Полезно для первого запуска и проверки ключевых слов.
dry_run: false
